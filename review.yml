actions:
  openapiHarvested: false
  reason: |
    No public API surface and no downloadable OpenAPI/Swagger exist to harvest.
    This is an honest identity-only (stub) record capturing the institution and
    its aggregator-only open-finance posture. No hosts, specs, or endpoints were
    invented.
