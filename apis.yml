name: Bank of Hawaii
kind: company
description: >-
  Bank of Hawaii is a state-chartered commercial bank organized under the laws
  of the State of Hawaii in 1897, a member of the Federal Reserve System and
  FDIC-insured. It is the principal banking subsidiary of Bank of Hawaii
  Corporation (NYSE: BOH), a Honolulu-headquartered regional financial services
  company serving Hawaii, Guam, and other Pacific islands with consumer,
  commercial, and wealth-management banking. As a regional US institution, Bank
  of Hawaii publishes no first-party public developer portal and exposes no
  documented public API surface; probes of developer.boh.com and
  developers.boh.com do not resolve. US open finance is voluntary and
  fragmented, and consumer-permissioned data access to Bank of Hawaii accounts
  is available in practice only through third-party aggregators (for example
  Plaid), not through a direct bank-operated API. No Financial Data Exchange
  (FDX) membership and no published CFPB Section 1033 data-access posture were
  found at the time of this record.
